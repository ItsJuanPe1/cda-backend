server:
  port: ${PORT:8080}
  tomcat:
    # Permite leer y descartar archivos algo mayores al límite para responder 400
    # en lugar de cortar la conexión (HU-015)
    max-swallow-size: 10MB

spring:
  application:
    name: cda-backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:cda-backend/.env[.properties]
  servlet:
    multipart:
      # HU-015: foto de perfil de máximo 5 MB
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # El esquema lo gobierna Flyway; Hibernate no crea ni altera tablas.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGIN:http://localhost:5173,http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

auth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:${AUTH_GOOGLE_CLIENT_ID:699612946028-er8cpcrvspuh60933qvur66dqi07jgn4.apps.googleusercontent.com}}
  jwt:
    secret: ${JWT_SECRET:${AUTH_JWT_SECRET:cda-backend-secret-key-univalle-palmira-2026-secure-token-32b}}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

disponibilidad:
  hora-inicio: ${DISPONIBILIDAD_HORA_INICIO:06:00}
  hora-fin: ${DISPONIBILIDAD_HORA_FIN:22:00}

cda:
  carga:
    max-horas-docente: 20
  cupos:
    max-por-grupo: ${CUPOS_MAX_POR_GRUPO:60}
  # HU-038: cola de correos. Los secretos de Gmail no llevan valor por defecto.
  notificaciones:
    programador-habilitado: ${NOTIFICACIONES_HABILITADAS:false}
    mail-from: ${MAIL_FROM:}
    copia: ${MAIL_COPIA_NOTIFICACIONES:}
    app-url: ${APP_URL:}
    recordatorio-dias-antes: ${RECORDATORIO_DIAS_ANTES:3}
    zona: ${APP_TIMEZONE:America/Bogota}
    intervalo-ms: 60000
    lote: 100
    max-intentos: 5
    reintentos-minutos: 5,15,60,240
  # Cliente OAuth de envío (Gmail API, scope gmail.send). Distinto de auth.google.client-id (inicio de sesión).
  gmail:
    client-id: ${GMAIL_CLIENT_ID:}
    client-secret: ${GMAIL_CLIENT_SECRET:}
    refresh-token: ${GMAIL_REFRESH_TOKEN:}