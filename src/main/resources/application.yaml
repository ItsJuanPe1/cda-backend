server:
  port: ${PORT:8080}

spring:
  application:
    name: cda-backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:cda-backend/.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGIN:http://localhost:5173,http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

auth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:${AUTH_GOOGLE_CLIENT_ID:}}
  jwt:
    secret: ${JWT_SECRET:${AUTH_JWT_SECRET:}}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}