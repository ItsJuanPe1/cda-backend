server:
  port: ${PORT:8080}

spring:
  application:
    name: cda-backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:cda-backend/.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    # V7 ya existe en la base compartida con un checksum histórico distinto.
    # Las migraciones pendientes siguen ejecutándose, pero no se bloquea el arranque
    # por la diferencia de contenido de una migración ya aplicada.
    validate-on-migrate: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGIN:http://localhost:5173,http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

auth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:${AUTH_GOOGLE_CLIENT_ID:699612946028-er8cpcrvspuh60933qvur66dqi07jgn4.apps.googleusercontent.com}}
  jwt:
    secret: ${JWT_SECRET:${AUTH_JWT_SECRET:cda-backend-secret-key-univalle-palmira-2026-secure-token-32b}}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

disponibilidad:
  hora-inicio: ${DISPONIBILIDAD_HORA_INICIO:06:00}
  hora-fin: ${DISPONIBILIDAD_HORA_FIN:22:00}